services:
  - type: web
    name: amazon-fire-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIRMS_MAP_KEY
        sync: false

  - type: web
    name: amazon-fire-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: amazon-fire-api
          envVarKey: RENDER_EXTERNAL_URL
